# Judah Scanner — VPS Docker Compose

services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile.vps
    container_name: judah-scanner
    restart: always
    ports:
      - "8000:8000"
    environment:
      - BINANCE_REST_BASE=https://fapi.binance.com
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - judah-net


networks:
  judah-net:
