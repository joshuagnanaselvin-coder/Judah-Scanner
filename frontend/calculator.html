<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta theme-color" content="#0c1220">
  <title>Judah — Calculator</title>
  <link rel="stylesheet" href="/static/style.css?v=6">
  <style>
    .calc-wrap { max-width: 560px; margin: 0 auto; padding: 12px; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .coin-search-wrap { position: relative; }
    .coin-search-wrap input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
      padding: 10px 12px; outline: none; font-family: inherit;
    }
    .coin-search-wrap input:focus { border-color: var(--accent); }
    .coin-dropdown {
      display: none; position: absolute; top: 100%; left: 0; right: 0;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); max-height: 200px; overflow-y: auto;
      z-index: 50; margin-top: 2px;
    }
    .coin-dropdown.open { display: block; }
    .coin-dropdown div {
      padding: 8px 12px; cursor: pointer; font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .coin-dropdown div:hover { background: var(--bg-hover); }
    .coin-dropdown .no-results { color: var(--text-muted); cursor: default; }
    .coin-price-fetching { color: var(--text-muted); font-size: 11px; margin-top: 4px; }
    .coin-price-fetched { color: var(--green); font-size: 11px; margin-top: 4px; }
    .field { margin-bottom: 10px; }
    .field label {
      display: block; font-size: 11px; color: var(--text-muted);
      font-weight: 600; margin-bottom: 4px; text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .field input, .field select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-size: 13px;
      padding: 8px 10px; outline: none; font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dir-toggle { display: flex; gap: 6px; }
    .dir-btn {
      flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text-sec); font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
    }
    .dir-btn.long.active { background: #22c55e; border-color: #22c55e; color: #000; }
    .dir-btn.short.active { background: #ef4444; border-color: #ef4444; color: #fff; }
    .sl-pct-grid { display: flex; gap: 6px; flex-wrap: wrap; }
    .sl-pct-btn {
      padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text-sec); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .sl-pct-btn:hover { border-color: var(--accent); }
    .sl-pct-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .risk-grid { display: flex; gap: 6px; flex-wrap: wrap; }
    .risk-btn {
      width: 52px; padding: 8px 0; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--bg); color: var(--text-sec);
      font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s;
      text-align: center;
    }
    .risk-btn:hover { border-color: var(--amber); color: var(--amber); }
    .risk-btn.active { background: var(--amber); border-color: var(--amber); color: #000; }
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .result-item {
      background: var(--bg); border-radius: var(--radius-sm);
      padding: 10px; text-align: center;
    }
    .result-label {
      font-size: 10px; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.3px; margin-bottom: 4px;
    }
    .result-value {
      font-size: 18px; font-weight: 700;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .result-value.green { color: var(--green); }
    .result-value.red { color: var(--red); }
    .result-value.amber { color: var(--amber); }
    .summary-box {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px; line-height: 1.7; color: var(--text-sec);
      margin-top: 12px;
    }
    .summary-box .hl { color: var(--accent); font-weight: 700; }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    .btn {
      flex: 1; padding: 9px 14px; border-radius: var(--radius-sm);
      border: none; font-size: 12px; font-weight: 700; cursor: pointer;
      transition: all 0.15s; text-align: center;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(1.15); }
    .btn-ghost {
      background: transparent; color: var(--text-sec);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--text-sec); color: var(--text); }
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      padding: 10px 18px; border-radius: var(--radius-sm);
      font-size: 12px; font-weight: 600; z-index: 9999;
      animation: toast-in 0.3s ease;
    }
    .toast.success { background: #22c55e; color: #000; }
    .toast.error { background: #ef4444; color: #fff; }
    .toast.info { background: var(--accent); color: #fff; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="calc-wrap">
    <!-- ═══ TRADE SETUP ═══ -->
    <div class="card">
      <div class="card-title">Trade Setup</div>

      <div class="field">
        <label>Coin</label>
        <div class="coin-search-wrap">
          <input type="text" id="coinSearch" placeholder="Search coin..." autocomplete="off">
          <div class="coin-dropdown" id="coinDropdown"></div>
        </div>
        <div class="coin-price-fetching" id="coinPriceInfo"></div>
      </div>

      <div class="field">
        <label>Direction</label>
        <div class="dir-toggle">
          <button class="dir-btn long active" onclick="setDir('LONG',this)">LONG</button>
          <button class="dir-btn short" onclick="setDir('SHORT',this)">SHORT</button>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Entry Price (USD)</label>
          <input type="number" id="entry" placeholder="0.00" step="any" oninput="calc()">
        </div>
        <div class="field">
          <label>SL Price (USD)</label>
          <input type="number" id="sl" placeholder="0.00" step="any" oninput="calc()">
        </div>
      </div>

      <div class="field">
        <label>SL % from Entry (quick set)</label>
        <div class="sl-pct-grid">
          <button class="sl-pct-btn" onclick="setSlPct(1)">1%</button>
          <button class="sl-pct-btn" onclick="setSlPct(2)">2%</button>
          <button class="sl-pct-btn" onclick="setSlPct(3)">3%</button>
          <button class="sl-pct-btn" onclick="setSlPct(4)">4%</button>
          <button class="sl-pct-btn" onclick="setSlPct(5)">5%</button>
        </div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:4px;">
          Sets SL price = Entry × (1 − SL%) for LONG, Entry × (1 + SL%) for SHORT
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Margin (USD)</label>
          <input type="number" id="margin" placeholder="100" step="1" value="100" oninput="calc()">
        </div>
        <div class="field">
          <label>Max Risk (USD) — what you want to lose if SL hits</label>
          <input type="number" id="riskCustom" placeholder="12" step="1" oninput="calc()">
        </div>
      </div>
    </div>

    <!-- ═══ RESULTS ═══ -->
    <div class="card">
      <div class="card-title">Results</div>
      <div class="result-grid">
        <div class="result-item">
          <div class="result-label">SL %</div>
          <div class="result-value" id="rSlPct">&mdash;</div>
        </div>
        <div class="result-item">
          <div class="result-label">Leverage</div>
          <div class="result-value" id="rLev">&mdash;</div>
        </div>
        <div class="result-item">
          <div class="result-label">Max Loss</div>
          <div class="result-value red" id="rMaxLoss">&mdash;</div>
        </div>
        <div class="result-item">
          <div class="result-label">Position Size</div>
          <div class="result-value" id="rPosSize">&mdash;</div>
        </div>
      </div>
      <div class="summary-box" id="summary">Fill entry + SL to see plan.</div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="saveToJournal()">Save to Journal</button>
        <button class="btn btn-ghost" onclick="resetCalc()">Reset</button>
      </div>
    </div>
  </div>

  <script>
    let direction = 'LONG';
    let currentRisk = 12;
    let currentSlPct = 5;
    let allCoins = [];
    let selectedSymbol = '';

    // ── Coin search ──
    async function loadCoins() {
      try {
        const res = await fetch('/api/pairs');
        const d = await res.json();
        allCoins = d.pairs || [];
      } catch (e) { console.error(e); }
    }
    loadCoins();

    const coinSearch = document.getElementById('coinSearch');
    const coinDropdown = document.getElementById('coinDropdown');
    const coinPriceInfo = document.getElementById('coinPriceInfo');

    coinSearch.addEventListener('input', () => {
      const q = coinSearch.value.toUpperCase().trim();
      if (!q) { coinDropdown.classList.remove('open'); return; }
      const matches = allCoins.filter(c => c.includes(q)).slice(0, 30);
      coinDropdown.innerHTML = matches.length
        ? matches.map(c => `<div data-coin="${c}">${c}</div>`).join('')
        : '<div class="no-results">No matches</div>';
      coinDropdown.classList.add('open');
    });

    coinDropdown.addEventListener('click', async (e) => {
      const coin = e.target.dataset.coin;
      if (!coin) return;
      selectedSymbol = coin;
      coinSearch.value = coin;
      coinDropdown.classList.remove('open');
      // Fetch live price from backend
      coinPriceInfo.textContent = 'Fetching price...';
      coinPriceInfo.className = 'coin-price-fetching';
      try {
        const res = await fetch('/api/coin-price?symbol=' + encodeURIComponent(coin));
        const d = await res.json();
        if (d.price) {
          document.getElementById('entry').value = d.price;
          coinPriceInfo.textContent = 'Price: ' + d.price + ' (source: ' + d.source + ')';
          coinPriceInfo.className = 'coin-price-fetched';
          calc();
        } else {
          coinPriceInfo.textContent = 'No price data available';
          coinPriceInfo.className = 'coin-price-fetching';
        }
      } catch (e) {
        coinPriceInfo.textContent = 'Failed to fetch price';
        coinPriceInfo.className = 'coin-price-fetching';
      }
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.coin-search-wrap')) coinDropdown.classList.remove('open');
    });

    // ── Direction ──
    function setDir(dir, btn) {
      direction = dir;
      document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calc();
    }

    // ── Risk ──
    function setRisk(amt, btn) {
      currentRisk = amt;
      document.getElementById('riskCustom').value = '';
      document.querySelectorAll('.risk-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      calc();
    }

    // ── SL % ──
    function setSlPct(pct) {
      currentSlPct = pct;
      document.querySelectorAll('.sl-pct-btn').forEach(b => {
        b.classList.toggle('active', parseInt(b.textContent) === pct);
      });
      applySlPct();
    }

    function applySlPct() {
      const entry = parseFloat(document.getElementById('entry').value);
      if (!entry) return;
      let sl;
      if (direction === 'LONG') sl = entry * (1 - currentSlPct / 100);
      else sl = entry * (1 + currentSlPct / 100);
      document.getElementById('sl').value = sl.toFixed(entry < 1 ? 6 : 2);
      calc();
    }

    // ── Core calculation ──
    function calc() {
      const entry = parseFloat(document.getElementById('entry').value);
      const sl = parseFloat(document.getElementById('sl').value);
      const margin = parseFloat(document.getElementById('margin').value) || 0;
      const customRisk = parseFloat(document.getElementById('riskCustom').value);
      const risk = customRisk || currentRisk;

      const rSlPct = document.getElementById('rSlPct');
      const rLev = document.getElementById('rLev');
      const rMaxLoss = document.getElementById('rMaxLoss');
      const rPosSize = document.getElementById('rPosSize');
      const summary = document.getElementById('summary');

      if (!entry || !sl) {
        rSlPct.innerHTML = '&mdash;'; rLev.innerHTML = '&mdash;';
        rMaxLoss.innerHTML = '&mdash;'; rPosSize.innerHTML = '&mdash;';
        summary.textContent = 'Fill entry + SL to see plan.';
        return;
      }

      const slDist = Math.abs(entry - sl);
      const slPct = (slDist / entry) * 100;
      const maxLoss = margin * slPct / 100;
      const lev = maxLoss > 0 ? risk / maxLoss : 0;
      const posSize = margin * lev;

      rSlPct.textContent = slPct.toFixed(3) + '%';
      rLev.textContent = lev > 0 ? lev.toFixed(1) + 'x' : '&mdash;';
      rMaxLoss.textContent = '$' + maxLoss.toFixed(2);
      rPosSize.textContent = '$' + posSize.toFixed(2);

      summary.innerHTML =
        `<span class="hl">${direction}</span> ${selectedSymbol || 'COIN'}\n` +
        `Entry: $${entry.toFixed(entry < 1 ? 6 : 2)} | SL: $${sl.toFixed(entry < 1 ? 6 : 2)}\n` +
        `SL: ${slPct.toFixed(2)}% | Leverage: ${lev > 0 ? lev.toFixed(1) + 'x' : '&mdash;'}\n` +
        `Margin: $${margin} | Risk: $${risk} | Max Loss: $${maxLoss.toFixed(2)}`;
    }

    function resetCalc() {
      document.getElementById('entry').value = '';
      document.getElementById('sl').value = '';
      document.getElementById('margin').value = '100';
      document.getElementById('riskCustom').value = '';
      currentRisk = 12; currentSlPct = 5;
      document.querySelectorAll('.sl-pct-btn').forEach(b => {
        b.classList.toggle('active', parseInt(b.textContent) === 5);
      });
      selectedSymbol = '';
      coinSearch.value = '';
      coinPriceInfo.textContent = '';
      calc();
    }

    // ── Save to journal ──
    async function saveToJournal() {
      const entry = parseFloat(document.getElementById('entry').value);
      const sl = parseFloat(document.getElementById('sl').value);
      if (!entry || !sl) { showToast('Enter entry + SL', 'error'); return; }
      const customRisk = parseFloat(document.getElementById('riskCustom').value);
      const risk = customRisk || currentRisk;
      const margin = parseFloat(document.getElementById('margin').value) || 0;
      const slDist = Math.abs(entry - sl);
      const maxLoss = margin * slDist / entry * 100;
      const lev = maxLoss > 0 ? risk / maxLoss : 0;

      const payload = {
        symbol: selectedSymbol || document.getElementById('coinSearch').value.toUpperCase() || 'MANUAL',
        direction, signal_type: 'NONE',
        entry_price: entry, sl_price: sl,
        rr: null,
        position_size: margin * lev,
        leverage: lev || null,
        outcome: 'OPEN',
        notes: `Calc: SL ${(slDist/entry*100).toFixed(2)}% | Risk INR${risk} | Lev ${lev > 0 ? lev.toFixed(1) + 'x' : 'N/A'}`,
        opened_at: new Date().toISOString(),
        tags: ['calculator'],
      };

      try {
        const res = await fetch('/api/journal/trades', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin', body: JSON.stringify(payload),
        });
        if (res.ok) { showToast('Saved to journal', 'success'); }
        else { showToast('Save failed', 'error'); }
      } catch (e) { showToast('Network error', 'error'); }
    }

    function showToast(msg, type) {
      const t = document.createElement('div');
      t.className = 'toast ' + (type || 'info');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }
  </script>
</body>
</html>
