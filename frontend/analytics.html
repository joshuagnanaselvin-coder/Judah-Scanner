<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c1220">
  <title>Judah — Analytics</title>
  <link rel="stylesheet" href="/static/style.css?v=6">
  <style>
    .a-wrap { max-width: 700px; margin: 0 auto; padding: 12px; }

    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .stat-box {
      background: var(--bg); border-radius: var(--radius-sm);
      padding: 12px; text-align: center;
    }
    .stat-box .s-label {
      font-size: 10px; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.3px; margin-bottom: 4px;
    }
    .stat-box .s-value {
      font-size: 22px; font-weight: 800;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .s-value.green { color: var(--green); }
    .s-value.red { color: var(--red); }
    .s-value.amber { color: var(--amber); }
    .s-value.blue { color: var(--accent); }
    .s-value.white { color: var(--text); }

    /* Breakdown table */
    .bk-table { width: 100%; border-collapse: collapse; }
    .bk-table th {
      text-align: left; font-size: 10px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.3px;
      padding: 6px 10px; border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .bk-table td {
      padding: 7px 10px; font-size: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .bk-table td:last-child {
      font-family: 'SF Mono', 'Fira Code', monospace; text-align: right;
    }
    .bk-table tr:last-child td { border-bottom: none; }

    .empty { text-align: center; color: var(--text-muted); padding: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="a-wrap">
    <!-- ═══ DATE FILTER ═══ -->
    <div class="card" style="padding:12px 16px;">
      <div class="toolbar" style="margin:0;">
        <div class="field" style="flex:1;margin:0;">
          <label style="margin:0 0 4px;">Filter by date (YYYY-MM-DD)</label>
          <input type="text" id="analyticsDate" placeholder="Leave empty for all time" style="width:100%;" oninput="loadAll()">
        </div>
        <div style="align-self:flex-end;">
          <button class="btn-sm" onclick="document.getElementById('analyticsDate').value='';loadAll();">Clear</button>
        </div>
      </div>
    </div>

    <!-- ═══ OVERVIEW ═══ -->
    <div class="card">
      <div class="card-title">Overview</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="s-label">Total Trades</div><div class="s-value blue" id="sTotal">&mdash;</div></div>
        <div class="stat-box"><div class="s-label">Win Rate</div><div class="s-value" id="sWR">&mdash;</div></div>
        <div class="stat-box"><div class="s-label">Expectancy</div><div class="s-value" id="sExp">&mdash;</div></div>
        <div class="stat-box"><div class="s-label">RR Ratio</div><div class="s-value amber" id="sRR">&mdash;</div></div>
        <div class="stat-box"><div class="s-label">Profit Factor</div><div class="s-value" id="sPF">&mdash;</div></div>
        <div class="stat-box"><div class="s-label">Max Loss</div><div class="s-value red" id="sML">&mdash;</div></div>
        <div class="stat-box"><div class="s-label">Max Profit</div><div class="s-value green" id="sMP">&mdash;</div></div>
        <div class="stat-box"><div class="s-label">Open Trades</div><div class="s-value amber" id="sOpen">&mdash;</div></div>
      </div>
    </div>

    <!-- ═══ BY DIRECTION ═══ -->
    <div class="card">
      <div class="card-title">By Direction</div>
      <table class="bk-table">
        <thead><tr><th>Direction</th><th>Trades</th><th>Win Rate</th><th>Avg PnL%</th></tr></thead>
        <tbody id="byDir"><tr><td colspan="4" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>

    <!-- ═══ BY SIGNAL TYPE ═══ -->
    <div class="card">
      <div class="card-title">By Signal Type (A-F)</div>
      <table class="bk-table">
        <thead><tr><th>Type</th><th>Trades</th><th>Win Rate</th><th>Avg PnL%</th></tr></thead>
        <tbody id="byType"><tr><td colspan="4" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>

    <!-- ═══ BY OUTCOME ═══ -->
    <div class="card">
      <div class="card-title">Outcome Breakdown</div>
      <table class="bk-table">
        <thead><tr><th>Outcome</th><th>Trades</th><th>Total PnL%</th></tr></thead>
        <tbody id="byOutcome"><tr><td colspan="3" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadAll() {
      try {
        const res = await fetch('/api/journal/stats');
        const d = await res.json();
        if (!d.total_trades && d.total_trades !== 0) {
          document.querySelectorAll('.empty').forEach(el => el.textContent = 'No trades yet.');
          return;
        }

        // Overview
        document.getElementById('sTotal').textContent = d.total_trades || 0;
        const wrEl = document.getElementById('sWR');
        wrEl.textContent = d.closed_trades ? d.win_rate + '%' : '—';
        wrEl.className = 's-value ' + (d.win_rate >= 50 ? 'green' : d.win_rate > 0 ? 'amber' : 'red');
        const expEl = document.getElementById('sExp');
        expEl.textContent = d.expectancy_pct != null ? d.expectancy_pct.toFixed(3) + '%' : '—';
        expEl.className = 's-value ' + (d.expectancy_pct > 0 ? 'green' : d.expectancy_pct < 0 ? 'red' : 'amber');
        const rrEl = document.getElementById('sRR');
        rrEl.textContent = d.avg_rr || '—';
        rrEl.className = 's-value ' + (d.avg_rr >= 1.5 ? 'green' : d.avg_rr >= 1.2 ? 'amber' : d.avg_rr > 0 ? 'white' : 'red');
        document.getElementById('sPF').textContent = d.profit_factor != null ? d.profit_factor.toFixed(2) : '—';
        document.getElementById('sML').textContent = d.max_consec_losses || 0;
        document.getElementById('sMP').textContent = d.max_consec_wins || 0;
        document.getElementById('sOpen').textContent = d.open_trades || 0;

        // By direction
        const dirBody = document.getElementById('byDir');
        if (d.by_direction && Object.keys(d.by_direction).length) {
          dirBody.innerHTML = Object.entries(d.by_direction).map(([dir, s]) => {
            const wr = s.n > 0 ? (s.wins / s.n * 100).toFixed(1) : 0;
            const avg = s.avg_pnl_pct != null ? s.avg_pnl_pct.toFixed(2) + '%' : '—';
            return `<tr><td><strong>${dir}</strong></td><td>${s.n}</td><td>${wr}%</td><td>${avg}</td></tr>`;
          }).join('');
        } else {
          dirBody.innerHTML = '<tr><td colspan="4" class="empty">No data</td></tr>';
        }

        // By signal type
        const typeBody = document.getElementById('byType');
        if (d.by_signal_type && Object.keys(d.by_signal_type).length) {
          typeBody.innerHTML = Object.entries(d.by_signal_type)
            .sort((a, b) => (b[1].n || 0) - (a[1].n || 0))
            .map(([st, s]) => {
              const wr = s.n > 0 ? (s.wins / s.n * 100).toFixed(1) : 0;
              const avg = s.avg_pnl_pct != null ? s.avg_pnl_pct.toFixed(2) + '%' : '—';
              return `<tr><td><strong>${st}</strong></td><td>${s.n}</td><td>${wr}%</td><td>${avg}</td></tr>`;
            }).join('');
        } else {
          typeBody.innerHTML = '<tr><td colspan="4" class="empty">No data</td></tr>';
        }

        // By outcome
        const outBody = document.getElementById('byOutcome');
        if (d.outcomes && Object.keys(d.outcomes).length) {
          outBody.innerHTML = Object.entries(d.outcomes).map(([out, s]) => {
            return `<tr><td><strong>${out}</strong></td><td>${s.n}</td><td>${s.total_pnl_pct != null ? s.total_pnl_pct.toFixed(2) + '%' : '—'}</td></tr>`;
          }).join('');
        } else {
          outBody.innerHTML = '<tr><td colspan="3" class="empty">No data</td></tr>';
        }
      } catch (e) {
        console.error(e);
        document.querySelectorAll('.empty').forEach(el => el.textContent = 'Error loading data.');
      }
    }

    loadAll();
  </script>
</body>
</html>
