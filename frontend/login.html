<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Judah — Login</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon-192.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0c1220;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .auth-box {
      background: #141c2e;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      margin: 20px;
    }
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo span {
      font-size: 12px;
      color: #64748b;
      display: block;
      margin-top: 4px;
    }
    .tab-bar {
      display: flex;
      gap: 0;
      margin-bottom: 24px;
      border-bottom: 1px solid #1e293b;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      color: #64748b;
      border-bottom: 2px solid transparent;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab.active {
      color: #60a5fa;
      border-bottom-color: #60a5fa;
    }
    .tab:hover { color: #94a3b8; }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #1e293b;
      border-radius: 8px;
      background: #0c1220;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #3b82f6;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error {
      background: #1c1017;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .success {
      background: #0c1c17;
      border: 1px solid #065f46;
      color: #6ee7b7;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .form-section { display: none; }
    .form-section.active { display: block; }
    .info-text {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 16px;
    }
    .info-text a {
      color: #60a5fa;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="auth-box">
    <div class="logo">
      <h1>Judah</h1>
      <span>Scanner — D1 + D2 + Fusion</span>
    </div>

    <div class="tab-bar">
      <div class="tab active" onclick="showTab('login')">Sign In</div>
      <div class="tab" onclick="showTab('signup')">Sign Up</div>
    </div>

    <div id="error" class="error"></div>
    <div id="success" class="success"></div>

    <!-- LOGIN FORM -->
    <div id="login-form" class="form-section active">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Min 6 characters" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Sign In</button>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signup-form" class="form-section">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="Min 6 characters" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Invite Code</label>
        <input type="text" id="signup-code" placeholder="Paste invite code from admin">
      </div>
      <button class="btn btn-primary" onclick="doSignup()">Create Account</button>
    </div>

    <p class="info-text">
      Admin access: <a href="/static/">Judah Scanner</a>
    </p>
  </div>

  <script>
    const API = "";

    function showError(msg) {
      const el = document.getElementById("error");
      el.textContent = msg;
      el.style.display = "block";
      document.getElementById("success").style.display = "none";
    }

    function showSuccess(msg) {
      const el = document.getElementById("success");
      el.textContent = msg;
      el.style.display = "block";
      document.getElementById("error").style.display = "none";
    }

    function showTab(name) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".form-section").forEach(f => f.classList.remove("active"));
      event.target.classList.add("active");
      document.getElementById(name + "-form").classList.add("active");
      document.getElementById("error").style.display = "none";
      document.getElementById("success").style.display = "none";
    }

    async function doLogin() {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      if (!email || !password) { showError("Email and password required"); return; }

      try {
        const r = await fetch(API + "/auth/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({email, password}),
        });
        const data = await r.json();
        if (!r.ok) { showError(data.error || "Login failed"); return; }
        document.cookie = "session_token=" + data.token + "; path=/; max-age=" + (7 * 86400);
        showSuccess("Login successful! Redirecting...");
        setTimeout(() => { window.location.href = "/"; }, 800);
      } catch (e) {
        showError("Network error: " + e.message);
      }
    }

    async function doSignup() {
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;
      const code = document.getElementById("signup-code").value.trim();
      if (!email || !password || !code) { showError("All fields required"); return; }
      if (password.length < 6) { showError("Password must be at least 6 characters"); return; }

      try {
        const r = await fetch(API + "/auth/signup", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({email, password, invite_code: code}),
        });
        const data = await r.json();
        if (!r.ok) { showError(data.error || "Signup failed"); return; }
        document.cookie = "session_token=" + data.token + "; path=/; max-age=" + (7 * 86400);
        showSuccess("Account created! Redirecting...");
        setTimeout(() => { window.location.href = "/"; }, 800);
      } catch (e) {
        showError("Network error: " + e.message);
      }
    }

    // Enter key support
    document.querySelectorAll("input").forEach(input => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const loginForm = document.getElementById("login-form");
          if (loginForm.classList.contains("active")) doLogin();
          else doSignup();
        }
      });
    });
  </script>
</body>
</html>
