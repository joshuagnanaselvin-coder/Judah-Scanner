<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Judah">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/icon-192.svg">
  <link rel="apple-touch-icon" href="/static/icon-192.svg">
  <title>Judah Scanner — D3 Fusion</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <div class="logo-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          </div>
          <div class="logo-text">
            <h1>Judah Scanner</h1>
            <span>D3 Fusion Engine</span>
          </div>
        </div>
      </div>

      <div class="header-right">
        <!-- Scan Status Indicator -->
        <div class="scan-status" id="scanStatus">
          <div class="scan-indicator" id="scanIndicator">
            <span class="scan-dot" id="scanDot"></span>
            <span class="scan-text" id="scanText">Connecting...</span>
          </div>
          <div class="scan-detail" id="scanDetail"></div>
        </div>

        <!-- Connection Status -->
        <div class="status-pill" id="wsStatus">
          <span class="pulse-dot" id="wsDot"></span>
          <span id="wsLabel">...</span>
        </div>

        <!-- Stats -->
        <div class="stat-group">
          <div class="stat-chip" title="D1 HTF Signals">
            <span class="stat-label">D1</span>
            <span class="stat-value" id="d1Count">0</span>
          </div>
          <div class="stat-chip" title="D2 LTF Signals">
            <span class="stat-label">D2</span>
            <span class="stat-value" id="d2Count">0</span>
          </div>
          <div class="stat-chip stat-accent" title="D3 Fusion Results">
            <span class="stat-label">Fusion</span>
            <span class="stat-value" id="totalSignals">0</span>
          </div>
        </div>

        <!-- Restart -->
        <button class="btn-icon" id="btnRestart" title="Restart scanner">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>
    </header>

    <!-- SCAN ACTIVITY BAR -->
    <div class="activity-bar" id="activityBar">
      <div class="activity-item" id="actD1">
        <span class="act-dot"></span>
        <span class="act-label">D1 Scan</span>
        <span class="act-status" id="actD1Status">—</span>
        <span class="act-time" id="actD1Time"></span>
      </div>
      <div class="activity-item" id="actD2">
        <span class="act-dot"></span>
        <span class="act-label">D2 Scan</span>
        <span class="act-status" id="actD2Status">—</span>
        <span class="act-time" id="actD2Time"></span>
      </div>
      <div class="activity-item" id="actD3">
        <span class="act-dot"></span>
        <span class="act-label">D3 Fusion</span>
        <span class="act-status" id="actD3Status">—</span>
        <span class="act-time" id="actD3Time"></span>
      </div>
    </div>

    <!-- MEE FILTERS (Spiral + Evolution) -->
    <div class="filter-section">
      <div class="filter-scroll" id="filterBar">
        <span class="filter-group-label">Spiral</span>
        <button class="filter-chip spiral-chip active" data-filter-spiral="all">All</button>
        <button class="filter-chip spiral-chip spiral-expansion" data-filter-spiral="Expansion">
          <span class="chip-dot" style="background:#22c55e"></span>Exp <span class="chip-count" id="countExpansion">0</span>
        </button>
        <button class="filter-chip spiral-chip spiral-correction" data-filter-spiral="Correction">
          <span class="chip-dot" style="background:#f97316"></span>Corr <span class="chip-count" id="countCorrection">0</span>
        </button>
        <button class="filter-chip spiral-chip spiral-failure" data-filter-spiral="Failure">
          <span class="chip-dot" style="background:#ef4444"></span>Fail <span class="chip-count" id="countFailure">0</span>
        </button>
        <button class="filter-chip spiral-chip spiral-neutral" data-filter-spiral="Neutral">
          <span class="chip-dot" style="background:#6b7280"></span>Neutral <span class="chip-count" id="countNeutral">0</span>
        </button>

        <span class="filter-sep"></span>
        <span class="filter-group-label">Trend</span>
        <button class="filter-chip evo-chip active" data-filter-evo="all">All</button>
        <button class="filter-chip evo-chip evo-improving" data-filter-evo="improving">↑ Improving</button>
        <button class="filter-chip evo-chip evo-stable" data-filter-evo="stable">→ Stable</button>
        <button class="filter-chip evo-chip evo-degrading" data-filter-evo="degrading">↓ Degrading</button>
      </div>

      <div class="dir-filters">
        <button class="dir-chip active" data-filter-dir="all">All</button>
        <button class="dir-chip" data-filter-dir="BULLISH">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="18 15 12 9 6 15"/></svg>
          Long
        </button>
        <button class="dir-chip bearish" data-filter-dir="BEARISH">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>
          Short
        </button>
      </div>
    </div>

    <!-- SIGNALS GRID -->
    <div class="signals-container" id="signalsContainer">
      <div class="empty-state" id="emptyState">
        <div class="empty-spinner" id="emptySpinner">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        </div>
        <h2 id="emptyTitle">Initializing Scanner...</h2>
        <p id="emptyMsg">Fetching 529 coins · HTF + 15M LTF analysis</p>
        <div class="empty-progress" id="emptyProgress">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js')
          .then((reg) => console.log('[PWA] SW registered:', reg.scope))
          .catch((err) => console.warn('[PWA] SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
