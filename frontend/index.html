<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0c1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Judah">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/icon-192.svg">
  <link rel="apple-touch-icon" href="/static/icon-192.svg">
  <title>Judah — D1/D2 Hybrid Scanner</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <div class="logo-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          </div>
          <div class="logo-text">
            <h1>Judah</h1>
            <span>Hybrid Scanner — D1 HTF + D2 15M + Decision Layer</span>
          </div>
        </div>
      </div>

      <div class="header-right">
        <div class="scan-status" id="scanStatus">
          <div class="scan-indicator" id="scanIndicator">
            <span class="scan-dot" id="scanDot"></span>
            <span class="scan-text" id="scanText">Connecting...</span>
          </div>
        </div>

        <div class="status-pill" id="wsStatus">
          <span class="pulse-dot" id="wsDot"></span>
          <span id="wsLabel">...</span>
        </div>

        <div class="stat-group">
          <div class="stat-chip">
            <span class="stat-label">Signals</span>
            <span class="stat-value" id="totalSignals">0</span>
          </div>
          <div class="stat-chip">
            <span class="stat-label">Scanned</span>
            <span class="stat-value" id="scannedCount">0</span>
          </div>
        </div>

        <button class="btn-icon" id="btnRestart" title="Restart scanner">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>
    </header>

    <!-- FILTER BAR -->
    <div class="filter-section">
      <div class="filter-scroll">
        <span class="filter-group-label">Direction</span>
        <button class="filter-chip dir-chip active" data-filter-dir="all">All</button>
        <button class="filter-chip dir-chip bullish" data-filter-dir="BULLISH">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="18 15 12 9 6 15"/></svg>
          Long
        </button>
        <button class="filter-chip dir-chip bearish" data-filter-dir="BEARISH">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>
          Short
        </button>

        <span class="filter-sep"></span>
        <span class="filter-group-label">Signal Type</span>
        <button class="filter-chip stype-chip active" data-filter-stype="all">All</button>
        <button class="filter-chip stype-chip" data-filter-stype="A">🟡 HTF Structure</button>
        <button class="filter-chip stype-chip" data-filter-stype="B">🔵 LTF Momentum</button>
        <button class="filter-chip stype-chip" data-filter-stype="C">🟢 Full Confluence</button>
        <button class="filter-chip stype-chip" data-filter-stype="D">🟠 Early Warn</button>
        <button class="filter-chip stype-chip" data-filter-stype="E">🔴 Conflict</button>
      </div>
    </div>

    <!-- TYPE E ALERT BAR -->
    <div id="typeEAlertContainer" style="display:none;"></div>

    <!-- SCAN ACTIVITY BAR -->
    <div class="activity-bar" id="activityBar">
      <div class="activity-item" id="actD1">
        <span class="act-label">D1</span>
        <span class="act-status" id="actD1Status">—</span>
      </div>
      <div class="activity-item" id="actD2">
        <span class="act-label">D2</span>
        <span class="act-status" id="actD2Status">—</span>
      </div>
      <div class="activity-item" id="actD3">
        <span class="act-label">D3</span>
        <span class="act-status" id="actD3Status">—</span>
      </div>
    </div>

    <!-- SIGNALS GRID -->
    <div class="signals-container" id="signalsContainer">
      <div class="empty-state" id="emptyState">
        <div class="empty-spinner" id="emptySpinner">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <h2 id="emptyTitle">Initializing...</h2>
        <p id="emptyMsg">Scanning markets · D1 HTF + D2 15M + Decision Layer</p>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js')
          .then(() => console.log('[PWA] SW registered'))
          .catch(err => console.warn('[PWA] SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
