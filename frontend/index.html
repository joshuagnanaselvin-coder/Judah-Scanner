<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Judah Scanner</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <header class="header">
      <div class="logo">
        <h1>Judah Scanner</h1>
        <span>D3 Fusion — 15M LTF on HTF Context</span>
      </div>
      <div class="header-right">
        <div class="status-item">
          <span class="status-dot disconnected" id="wsDot"></span>
          <span id="wsLabel">Connecting...</span>
        </div>
        <div class="stat-chip" title="D1 coins analyzed">D1: <strong id="d1Count">0</strong></div>
        <div class="stat-chip" title="D2 LTF signals">D2: <strong id="d2Count">0</strong></div>
        <div class="stat-chip" title="D3 fusion signals">Fusion: <strong id="totalSignals">0</strong></div>
        <div class="mode-group">
          <label for="d2Mode" title="D2 Sensitivity: controls how strict the LTF score threshold is">Mode:</label>
          <select id="d2Mode" class="mode-select">
            <option value="STRICT">🔴 Strict (70)</option>
            <option value="BALANCED">🟡 Balanced (60)</option>
            <option value="EXPLORATION">🟢 Exploration (50)</option>
            <option value="DEBUG">🔵 Debug (40)</option>
          </select>
          <span id="modeThreshold" class="mode-threshold">70</span>
        </div>
        <button class="btn-restart" id="btnRestart" title="Clear &amp; re-bootstrap">
          <span class="restart-icon">&#x21BB;</span>
          <span class="restart-label">Restart</span>
        </button>
        <div class="status-item" id="signalCount">0 setups</div>
        <div class="status-item" id="lastUpdate">--</div>
      </div>
    </header>

    <!-- BUCKET FILTER BAR -->
    <div class="bucket-bar">
      <div class="bucket-group">
        <label>Bucket:</label>
        <button class="filter-btn active" data-filter-bucket="all">All</button>
        <button class="filter-btn" data-filter-bucket="READY">
          READY <span class="bucket-count ready" id="countReady">0</span>
        </button>
        <button class="filter-btn" data-filter-bucket="EARLY">
          EARLY <span class="bucket-count early" id="countEarly">0</span>
        </button>
        <button class="filter-btn" data-filter-bucket="TRAP">
          TRAP <span class="bucket-count trap" id="countTrap">0</span>
        </button>
      </div>
      <div class="dir-group">
        <div class="bucket-group">
          <label>Dir:</label>
          <button class="filter-btn active" data-filter-dir="all">All</button>
          <button class="filter-btn" data-filter-dir="BULLISH">Long</button>
          <button class="filter-btn" data-filter-dir="BEARISH">Short</button>
        </div>
      </div>
    </div>

    <!-- SIGNALS -->
    <div class="signals-container" id="signalsContainer">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">&#x1F4CA;</div>
        <h2>Waiting for signals...</h2>
        <p>Scanning 529 coins across 1H / 4H / 1D (D1) + 15M (D2)</p>
        <p class="hint">Fusion signals appear here in real-time</p>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
