<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta theme-color" content="#0c1220">
  <title>Judah — Journal</title>
  <link rel="stylesheet" href="/static/style.css?v=6">
  <style>
    .j-wrap { max-width: 820px; margin: 0 auto; padding: 12px; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .field { margin-bottom: 10px; }
    .field label {
      display: block; font-size: 11px; color: var(--text-muted);
      font-weight: 600; margin-bottom: 4px; text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .field input, .field select, .field textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-size: 13px;
      padding: 8px 10px; outline: none; font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 60px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Signal type selector A-F */
    .stype-row { display: flex; gap: 6px; }
    .stype-btn {
      width: 40px; height: 40px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--bg);
      color: var(--text-sec); font-size: 15px; font-weight: 800;
      cursor: pointer; transition: all 0.15s;
    }
    .stype-btn:hover { border-color: var(--accent); }
    .stype-btn.active-a { background: #22c55e; border-color: #22c55e; color: #000; }
    .stype-btn.active-b { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    .stype-btn.active-c { background: #a855f7; border-color: #a855f7; color: #fff; }
    .stype-btn.active-d { background: #f59e0b; border-color: #f59e0b; color: #000; }
    .stype-btn.active-e { background: #ef4444; border-color: #ef4444; color: #fff; }
    .stype-btn.active-f { background: #a855f7; border-color: #a855f7; color: #fff; }

    .dir-toggle { display: flex; gap: 6px; }
    .dir-btn {
      flex: 1; padding: 8px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--bg);
      color: var(--text-sec); font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
    }
    .dir-btn.long.active { background: #22c55e; border-color: #22c55e; color: #000; }
    .dir-btn.short.active { background: #ef4444; border-color: #ef4444; color: #fff; }

    .outcome-toggle { display: flex; gap: 6px; }
    .out-btn {
      flex: 1; padding: 7px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--bg);
      color: var(--text-sec); font-size: 11px; font-weight: 700;
      cursor: pointer; transition: all 0.15s; text-align: center;
    }
    .out-btn.win.active { background: #22c55e; border-color: #22c55e; color: #000; }
    .out-btn.loss.active { background: #ef4444; border-color: #ef4444; color: #fff; }
    .out-btn.be.active { background: #f59e0b; border-color: #f59e0b; color: #000; }
    .out-btn.open.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }

    .btn {
      padding: 9px 14px; border-radius: var(--radius-sm);
      border: none; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; flex: 1; }
    .btn-primary:hover { filter: brightness(1.15); }
    .btn-ghost {
      background: transparent; color: var(--text-sec);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--text-sec); color: var(--text); }
    .btn-sm { padding: 5px 10px; font-size: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text-sec); cursor: pointer; }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm.danger { color: var(--red); }
    .btn-sm.danger:hover { border-color: var(--red); }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .toolbar .month-nav { display: flex; gap: 4px; align-items: center; }
    .toolbar .month-nav span { font-size: 13px; font-weight: 700; min-width: 120px; text-align: center; }

    /* Calendar grid */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-dow {
      text-align: center; font-size: 10px; font-weight: 700;
      color: var(--text-muted); padding: 4px; text-transform: uppercase;
    }
    .cal-cell {
      background: var(--bg); border-radius: var(--radius-sm);
      padding: 6px; min-height: 55px; font-size: 11px;
      position: relative; border: 1px solid transparent;
    }
    .cal-cell.has-trades { border-color: var(--accent); }
    .cal-cell.empty { opacity: 0.3; }
    .cal-cell .day-num { font-weight: 700; font-size: 12px; margin-bottom: 2px; }
    .cal-cell .day-count { font-size: 10px; color: var(--accent); }
    .cal-cell .day-pnl { font-size: 10px; }
    .cal-cell .day-pnl.win { color: var(--green); }
    .cal-cell .day-pnl.loss { color: var(--red); }
    .cal-cell.today { background: rgba(99,102,241,0.1); border-color: var(--accent); }

    /* Trade log */
    .trade-log-header {
      display: grid; grid-template-columns: 35px 70px 55px 28px 65px 55px 65px 55px 65px 1fr 32px;
      gap: 4px; padding: 8px 10px; background: var(--bg);
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.3px;
      border-bottom: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0;
    }
    .trade-row {
      display: grid; grid-template-columns: 35px 70px 55px 28px 65px 55px 65px 55px 65px 1fr 32px;
      gap: 4px; padding: 7px 10px; font-size: 12px;
      border-bottom: 1px solid var(--border-subtle);
      align-items: center;
    }
    .trade-row:hover { background: var(--bg-hover); }
    .badge {
      display: inline-block; padding: 2px 6px; border-radius: 3px;
      font-size: 10px; font-weight: 700; text-align: center;
    }
    .badge-win { background: rgba(34,197,94,0.15); color: var(--green); }
    .badge-loss { background: rgba(239,68,68,0.15); color: var(--red); }
    .badge-be { background: rgba(245,158,11,0.15); color: var(--amber); }
    .badge-open { background: rgba(59,130,246,0.15); color: var(--accent); }
    .badge-long { background: rgba(34,197,94,0.1); color: var(--green); }
    .badge-short { background: rgba(239,68,68,0.1); color: var(--red); }
    .pnl-pos { color: var(--green); font-weight: 600; }
    .pnl-neg { color: var(--red); font-weight: 600; }
    .notes-preview {
      font-size: 11px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .del-btn {
      background: none; border: none; color: var(--red);
      cursor: pointer; font-size: 14px; padding: 0;
    }
    .del-btn:hover { color: #ff3333; }
    .img-preview {
      max-width: 60px; max-height: 40px; border-radius: 3px;
      border: 1px solid var(--border); cursor: pointer;
      vertical-align: middle; margin-left: 4px;
    }
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      padding: 10px 18px; border-radius: var(--radius-sm);
      font-size: 12px; font-weight: 600; z-index: 9999;
      animation: toast-in 0.3s ease;
    }
    .toast.success { background: #22c55e; color: #000; }
    .toast.error { background: #ef4444; color: #fff; }
    .toast.info { background: var(--accent); color: #fff; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

    /* Paste overlay */
    .paste-hint {
      font-size: 10px; color: var(--text-muted); margin-top: 4px;
      font-style: italic;
    }
    .image-preview-area {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;
    }
    .image-preview-area img {
      max-width: 80px; max-height: 60px; border-radius: 4px;
      border: 1px solid var(--border); cursor: pointer;
    }
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-overlay img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
    .modal-close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 30px; cursor: pointer; }

    .bk-table { width: 100%; border-collapse: collapse; }
    .bk-table td {
      padding: 6px 10px; font-size: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .bk-table tr:last-child td { border-bottom: none; }

    .empty { text-align: center; color: var(--text-muted); padding: 20px; font-size: 13px; }
    .tab-bar { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn {
      padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--bg); color: var(--text-sec); font-size: 11px; font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body>
  <div class="j-wrap">
    <!-- ═══ NEW TRADE ═══ -->
    <div class="card">
      <div class="card-title">New Trade</div>

      <div class="field-row">
        <div class="field">
          <label>Coin</label>
          <input type="text" id="fCoin" placeholder="BTCUSDT">
        </div>
        <div class="field">
          <label>Signal Type</label>
          <div class="stype-row">
            <button class="stype-btn active-a" onclick="setType('A',this)">A</button>
            <button class="stype-btn" onclick="setType('B',this)">B</button>
            <button class="stype-btn" onclick="setType('C',this)">C</button>
            <button class="stype-btn" onclick="setType('D',this)">D</button>
            <button class="stype-btn" onclick="setType('E',this)">E</button>
            <button class="stype-btn" onclick="setType('F',this)">F</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Direction</label>
        <div class="dir-toggle">
          <button class="dir-btn long active" onclick="setDir('LONG',this)">LONG</button>
          <button class="dir-btn short" onclick="setDir('SHORT',this)">SHORT</button>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Entry Price</label>
          <input type="number" id="fEntry" step="any" placeholder="0.00">
        </div>
        <div class="field">
          <label>Exit Price</label>
          <input type="number" id="fExit" step="any" placeholder="0.00">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Max Loss ($)</label>
          <input type="number" id="fMaxLoss" step="any" placeholder="e.g. 50">
        </div>
        <div class="field">
          <label>Max Profit ($)</label>
          <input type="number" id="fMaxProfit" step="any" placeholder="e.g. 150">
        </div>
      </div>

      <div class="field">
        <label>Profit %</label>
        <input type="number" id="fPnl" step="0.1" placeholder="e.g. 5.2 for +5.2%">
      </div>

      <div class="field">
        <label>Outcome</label>
        <div class="outcome-toggle">
          <button class="out-btn win" onclick="setOutcome('WIN',this)">WIN</button>
          <button class="out-btn loss" onclick="setOutcome('LOSS',this)">LOSS</button>
          <button class="out-btn be" onclick="setOutcome('BREAK_EVEN',this)">BE</button>
          <button class="out-btn open active" onclick="setOutcome('OPEN',this)">OPEN</button>
        </div>
      </div>

      <div class="field">
        <label>Why I took this trade</label>
        <textarea id="fNotes" placeholder="Setup reason, confluence, market condition..."></textarea>
      </div>

      <div class="field">
        <label>Chart Screenshot (Ctrl+V paste below or click to upload)</label>
        <textarea id="fScreenshot" style="min-height:35px;font-size:11px;" placeholder="Paste image here (Ctrl+V) — or paste into this box"></textarea>
        <div class="image-preview-area" id="imagePreviewArea"></div>
        <div class="paste-hint">Ctrl+V paste from TradingView works here. The image is saved with the trade.</div>
      </div>

      <div class="field">
        <label>Learning / Remarks</label>
        <textarea id="fRemarks" placeholder="What went right / wrong, what to improve next time..."></textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="saveTrade()">Save Trade</button>
        <button class="btn btn-ghost" onclick="clearForm()">Clear</button>
        <button class="btn btn-ghost" onclick="exportCSV()">Download CSV</button>
      </div>
    </div>

    <!-- ═══ CALENDAR + TOOLBAR ═══ -->
    <div class="card">
      <div class="card-title">Journal Calendar</div>
      <div class="toolbar">
        <div class="month-nav">
          <button class="btn-sm" onclick="changeMonth(-1)">&lt;</button>
          <span id="monthLabel"></span>
          <button class="btn-sm" onclick="changeMonth(1)">&gt;</button>
        </div>
        <span style="font-size:11px;color:var(--text-muted);">Click a day to view trades</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <!-- ═══ TRADE LOG / TRADE DETAIL ═══ -->
    <div class="tab-bar" id="tabBar" style="display:none;">
      <button class="tab-btn active" data-tab="trades" onclick="switchTab('trades')">Trades</button>
      <button class="tab-btn" data-tab="detail" onclick="switchTab('detail')">Detail</button>
    </div>

    <div class="card" id="tradesCard">
      <div class="card-title">Trade Log <span id="tradeDateLabel" style="color:var(--accent)"></span></div>
      <div id="tradeList">
        <div class="empty">Loading...</div>
      </div>
    </div>

    <div class="card" id="detailCard" style="display:none;">
      <div class="card-title">Trade Detail</div>
      <div id="tradeDetail"><div class="empty">Select a trade to view details.</div></div>
    </div>
  </div>

  <!-- Image modal -->
  <div class="modal-overlay" id="imgModal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img id="modalImg" src="">
  </div>

  <script>
    let direction = 'LONG';
    let signalType = 'A';
    let outcome = 'OPEN';
    let pastedImage = null;

    // Calendar state
    let calYear, calMonth, selectedDay;

    const STYPE_CLASS = { A:'active-a', B:'active-b', C:'active-c', D:'active-d', E:'active-e', F:'active-f' };
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    function setDir(d, btn) {
      direction = d;
      document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    function setType(t, btn) {
      signalType = t;
      document.querySelectorAll('.stype-btn').forEach(b => b.className = 'stype-btn');
      btn.classList.add(STYPE_CLASS[t] || 'active-a');
    }
    function setOutcome(o, btn) {
      outcome = o;
      document.querySelectorAll('.out-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // ── Calendar ──
    function initCalendar() {
      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();
      selectedDay = null;
      renderCalendar();
    }

    function changeMonth(delta) {
      calMonth += delta;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      if (calMonth > 11) { calMonth = 0; calYear++; }
      selectedDay = null;
      renderCalendar();
      loadTrades();
    }

    async function renderCalendar() {
      document.getElementById('monthLabel').textContent = MONTHS[calMonth] + ' ' + calYear;
      const grid = document.getElementById('calGrid');
      const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const today = new Date();

      // Fetch trade counts per day for this month
      let dayData = {};
      try {
        const url = '/api/journal/trades?limit=500&sort_by=opened_at&sort_dir=ASC';
        const res = await fetch(url, { credentials: 'same-origin' });
        const d = await res.json();
        if (d.trades) {
          d.trades.forEach(t => {
            if (!t.opened_at) return;
            const day = new Date(t.opened_at);
            if (day.getFullYear() === calYear && day.getMonth() === calMonth) {
              const dNum = day.getDate();
              if (!dayData[dNum]) dayData[dNum] = { count: 0, pnl: 0, wins: 0, losses: 0 };
              dayData[dNum].count++;
              if (t.pnl_pct != null) {
                dayData[dNum].pnl += t.pnl_pct;
                if (t.outcome === 'WIN') dayData[dNum].wins++;
                if (t.outcome === 'LOSS') dayData[dNum].losses++;
              }
            }
          });
        }
      } catch (e) { console.error(e); }

      let html = '';
      ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
        html += `<div class="cal-dow">${d}</div>`;
      });
      for (let i = 0; i < firstDay; i++) {
        html += '<div class="cal-cell empty"></div>';
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const isToday = (calYear === today.getFullYear() && calMonth === today.getMonth() && d === today.getDate());
        const hasTrades = dayData[d];
        const cls = ['cal-cell', isToday ? 'today' : '', hasTrades ? 'has-trades' : ''].join(' ');
        let pnlHtml = '';
        if (hasTrades) {
          const dd = dayData[d];
          const pnlClass = dd.pnl > 0 ? 'win' : dd.pnl < 0 ? 'loss' : '';
          pnlHtml = `<div class="day-pnl ${pnlClass}">${dd.wins}W/${dd.losses}L</div>`;
        }
        html += `<div class="${cls}" onclick="selectDay(${d})" style="cursor:pointer;">
          <div class="day-num">${d}</div>
          ${hasTrades ? `<div class="day-count">${hasTrades.count} trades</div>` : ''}
          ${pnlHtml}
        </div>`;
      }
      grid.innerHTML = html;
    }

    function selectDay(d) {
      selectedDay = d;
      loadTrades();
    }

    function getDateLabel() {
      if (selectedDay) {
        return `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(selectedDay).padStart(2,'0')}`;
      }
      return '';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.getElementById('tradesCard').style.display = tab === 'trades' ? '' : 'none';
      document.getElementById('detailCard').style.display = tab === 'detail' ? '' : 'none';
      document.getElementById('tabBar').style.display = 'flex';
    }

    // ── Trades ──
    async function loadTrades() {
      const list = document.getElementById('tradeList');
      const dateLabel = document.getElementById('tradeDateLabel');
      const tabBar = document.getElementById('tabBar');

      if (selectedDay) {
        tabBar.style.display = 'flex';
        const ds = getDateLabel();
        dateLabel.textContent = '— ' + ds;
      } else {
        tabBar.style.display = 'none';
        dateLabel.textContent = '';
      }

      let url = '/api/journal/trades?limit=50&sort_by=opened_at&sort_dir=DESC';
      const date = getDateLabel();
      if (date) url += '&date=' + date;

      try {
        const res = await fetch(url, { credentials: 'same-origin' });
        const d = await res.json();
        if (!d.trades || !d.trades.length) {
          list.innerHTML = '<div class="empty">No trades for this day.</div>';
          return;
        }
        list.innerHTML = d.trades.map(t => {
          const outClass = t.outcome === 'WIN' ? 'badge-win' : t.outcome === 'LOSS' ? 'badge-loss' : t.outcome === 'BREAK_EVEN' ? 'badge-be' : 'badge-open';
          const dirClass = t.direction === 'LONG' ? 'badge-long' : 'badge-short';
          const pnlClass = t.pnl_pct > 0 ? 'pnl-pos' : t.pnl_pct < 0 ? 'pnl-neg' : '';
          const date = t.opened_at ? t.opened_at.split('T')[0] : '—';
          const time = t.opened_at ? t.opened_at.split('T')[1]?.substring(0,5) || '' : '';
          const shortNotes = (t.notes || '').split('\n')[0].slice(0, 40);
          let imgHtml = '';
          if (t.screenshot_url) {
            imgHtml = `<img class="img-preview" src="${t.screenshot_url}" onclick="showImage('${t.screenshot_url}')" title="Chart screenshot">`;
          }
          return `<div class="trade-row" onclick="showDetail(${t.id})" style="cursor:pointer;">
            <span style="color:var(--text-muted)">${t.id}</span>
            <span><strong>${t.symbol}</strong>${imgHtml}</span>
            <span><span class="badge ${dirClass}">${t.direction}</span></span>
            <span><span class="badge" style="background:var(--border);color:var(--text-sec)">${t.signal_type||'—'}</span></span>
            <span style="font-family:'SF Mono',monospace;font-size:11px">${t.entry_price ? t.entry_price.toFixed(t.entry_price < 1 ? 6 : 2) : '—'}</span>
            <span style="font-family:'SF Mono',monospace;font-size:11px">${t.exit_price ? t.exit_price.toFixed(t.exit_price < 1 ? 6 : 2) : '—'}</span>
            <span class="${pnlClass}">${t.pnl_pct != null ? t.pnl_pct.toFixed(2) + '%' : '—'}</span>
            <span><span class="badge ${outClass}">${t.outcome}</span></span>
            <span style="font-size:11px;color:var(--text-muted)">${time}</span>
            <span class="notes-preview" title="${(t.notes||'').replace(/"/g,'&quot;')}">${shortNotes || '—'}</span>
            <button class="del-btn" onclick="event.stopPropagation();delTrade(${t.id})" title="Delete">&times;</button>
          </div>`;
        }).join('');
      } catch (e) { console.error(e); }
    }

    async function showDetail(id) {
      document.getElementById('tabBar').style.display = 'flex';
      switchTab('detail');
      const detail = document.getElementById('tradeDetail');
      detail.innerHTML = '<div class="empty">Loading...</div>';
      try {
        const res = await fetch('/api/journal/trades/' + id, { credentials: 'same-origin' });
        const t = await res.json();
        if (!t.id) { detail.innerHTML = '<div class="empty">Not found.</div>'; return; }
        const rows = [
          ['Coin', t.symbol], ['Direction', t.direction], ['Signal Type', t.signal_type],
          ['Entry', t.entry_price], ['Exit', t.exit_price], ['SL', t.sl_price],
          ['Outcome', t.outcome], ['PnL %', t.pnl_pct != null ? t.pnl_pct + '%' : '—'],
          ['Opened', t.opened_at], ['Closed', t.closed_at || '—'],
          ['Notes', (t.notes || '').substring(0, 500)],
        ];
        detail.innerHTML = '<table class="bk-table" style="width:100%;">' +
          rows.map(([k,v]) => `<tr><td style="width:30%;padding:6px 10px;font-weight:700;font-size:11px;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border-subtle);">${k}</td><td style="padding:6px 10px;font-size:12px;border-bottom:1px solid var(--border-subtle);">${v||'—'}</td></tr>`).join('') +
          '</table>' +
          `<div style="margin-top:12px;">
            <button class="btn-sm" onclick="delTrade(${t.id})">Delete Trade</button>
            <button class="btn-sm" onclick="switchTab('trades')">Back to List</button>
          </div>`;
      } catch (e) { detail.innerHTML = '<div class="empty">Error loading.</div>'; }
    }

    async function delTrade(id) {
      if (!confirm('Delete trade #' + id + '?')) return;
      try {
        const res = await fetch('/api/journal/trades/' + id, { method: 'DELETE', credentials: 'same-origin' });
        if (res.ok) { showToast('Deleted', 'success'); renderCalendar(); loadTrades(); }
      } catch (e) { showToast('Error', 'error'); }
    }

    // ── Image paste ──
    document.addEventListener('paste', async (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          const file = item.getAsFile();
          const reader = new FileReader();
          reader.onload = async () => {
            pastedImage = reader.result;
            const area = document.getElementById('imagePreviewArea');
            area.innerHTML = `<img src="${reader.result}" title="Pasted from clipboard" onclick="showImage('${reader.result}')">`;
            showToast('Image pasted — will save with trade', 'success');
          };
          reader.readAsDataURL(file);
          break;
        }
      }
    });

    function showImage(url) {
      document.getElementById('modalImg').src = url;
      document.getElementById('imgModal').classList.add('open');
    }
    function closeModal() {
      document.getElementById('imgModal').classList.remove('open');
    }

    // ── Save trade ──
    async function saveTrade() {
      const coin = document.getElementById('fCoin').value.trim().toUpperCase();
      if (!coin) { showToast('Enter coin name', 'error'); return; }
      const entryRaw = document.getElementById('fEntry').value.trim();
      const entry = entryRaw !== '' ? parseFloat(entryRaw) : null;
      if (entry === null || isNaN(entry)) { showToast('Enter entry price', 'error'); return; }
      const exitRaw = document.getElementById('fExit').value.trim();
      const exit = exitRaw !== '' ? parseFloat(exitRaw) : null;
      const maxLoss = parseFloat(document.getElementById('fMaxLoss').value) || null;
      const maxProfit = parseFloat(document.getElementById('fMaxProfit').value) || null;
      const pnl = parseFloat(document.getElementById('fPnl').value) || null;
      const notes = document.getElementById('fNotes').value;
      const remarks = document.getElementById('fRemarks').value;
      const fullNotes = [notes, remarks ? '[Learning: ' + remarks + ']' : ''].filter(Boolean).join('\n');

      // Upload screenshot if pasted
      let screenshotUrl = null;
      if (pastedImage) {
        try {
          const res = await fetch('/api/journal/image', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ image: pastedImage, filename: coin + '_' + Date.now() + '.png' }),
          });
          const d = await res.json();
          if (d.url) screenshotUrl = d.url;
        } catch (e) { console.error(e); }
      }

      const payload = {
        symbol: coin, direction, signal_type: signalType,
        entry_price: entry, exit_price: exit,
        sl_price: entry ? (direction === 'LONG' ? entry * 0.96 : entry * 1.04) : null,
        tp_price: null, rr: null,
        outcome, pnl_pct: pnl,
        notes: fullNotes || 'No notes',
        screenshot_url: screenshotUrl,
        opened_at: new Date().toISOString(),
        tags: [signalType],
      };

      try {
        const res = await fetch('/api/journal/trades', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin', body: JSON.stringify(payload),
        });
        const respData = await res.json().catch(() => ({}));
        if (res.ok) {
          showToast('Saved', 'success');
          clearForm();
          initCalendar();
          loadTrades();
        } else {
          showToast('Save failed: ' + (respData.error || res.status + ' ' + res.statusText), 'error');
        }
      } catch (e) { showToast('Network error', 'error'); }
    }

    function clearForm() {
      ['fCoin','fEntry','fExit','fMaxLoss','fMaxProfit','fPnl','fNotes','fRemarks','fScreenshot'].forEach(id => {
        document.getElementById(id).value = '';
      });
      direction = 'LONG'; signalType = 'A'; outcome = 'OPEN'; pastedImage = null;
      document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.dir-btn.long')[0]?.classList.add('active');
      document.querySelectorAll('.stype-btn').forEach(b => b.className = 'stype-btn');
      document.querySelectorAll('.stype-btn')[0]?.classList.add('active-a');
      document.querySelectorAll('.out-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.out-btn.open')[0]?.classList.add('active');
      document.getElementById('imagePreviewArea').innerHTML = '';
    }

    // ── CSV Export ──
    async function exportCSV() {
      try {
        const date = getDateLabel();
        const url = '/api/journal/export?format=csv' + (date ? '&date=' + date : '');
        const res = await fetch(url, { credentials: 'same-origin' });
        if (!res.ok) { showToast('No trades to export', 'error'); return; }
        const blob = await res.blob();
        const dl = document.createElement('a');
        dl.href = URL.createObjectURL(blob);
        dl.download = 'journal_' + (date || 'all') + '.csv';
        dl.click();
        showToast('CSV downloaded', 'success');
      } catch (e) { showToast('Export failed', 'error'); }
    }

    function getCookie(name) {
      const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return m ? m[2] : '';
    }

    function showToast(msg, type) {
      const t = document.createElement('div');
      t.className = 'toast ' + (type || 'info');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    initCalendar();
    loadTrades();
  </script>
</body>
</html>
